<text x="626" y="752.5" fill="#65766e" font-size="10" font-family="Microsoft YaHei, sans-serif">主方案不包含电量、鸣笛、亮度控制、SD 卡或电池充电。</text>
<text x="39" y="802.65" fill="#a9620c" font-size="9" font-family="Microsoft YaHei, sans-serif">DNP = 不贴装。连接器按实物 1脚和厂家封装核对；上图不是屏幕原插座的封装。</text>
